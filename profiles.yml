# Project-local profile. Set DBT_PROFILES_DIR=. (or run dbt from this folder
# with `--profiles-dir .`). The default target is DuckDB, so a stranger can
# clone the repo and `dbt build` without touching cloud credentials.
#
# For Snowflake, create a .env from .env.example and run
# `source .env && dbt build --target snowflake`.
hindsight_warehouse:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'hindsight_warehouse.duckdb') }}"
      threads: 4
      # Install the json extension once per database; harmless if already present.
      extensions:
        - json

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # Key-pair auth: the private key stays on this machine, outside the repo.
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'HINDSIGHT') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: 4
      client_session_keep_alive: false
      reuse_connections: true
      connect_retries: 5
      connect_timeout: 30
      retry_on_database_errors: true
      retry_all: true
